<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHub - Find Your Next Career | Three-Role Job Portal</title>
  <meta name="description" content="JobHub is an enterprise job portal platform connecting job seekers, employers, and administrators.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets matching the 9 design screens -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/jobs.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
  <!-- Application Container -->
  <div id="app"></div>

  <!-- Reusable Global Modal Component -->
  <div id="global-modal" class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button type="button" class="modal-close-btn" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Client-side Scripts -->
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
